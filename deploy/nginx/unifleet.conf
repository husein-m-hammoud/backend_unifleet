# UNIFLEET — nginx site config
#
# Serves the React SPA and the Laravel API from the SAME ORIGIN. That is not a
# style preference: src/lib/api.ts calls the relative path /api, so the browser
# never makes a cross-origin request. Consequences worth knowing before editing
# this file:
#   - There is no CORS preflight, so config/cors.php is irrelevant in prod.
#   - The same build works on the bare IP and on the real domain. Pointing DNS
#     at this box requires no rebuild and no change here beyond server_name.
# Splitting the SPA and API onto different hosts would break both of those.
#
# Install:
#   sudo cp deploy/nginx/unifleet.conf /etc/nginx/sites-available/unifleet
#   sudo ln -sf /etc/nginx/sites-available/unifleet /etc/nginx/sites-enabled/unifleet
#   sudo rm -f /etc/nginx/sites-enabled/default      # stops the Ubuntu placeholder
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    # Both are listed so this file does not need editing when DNS goes live.
    server_name 8.213.39.81 fleet.unimaccompany.com;

    # --- TLS -----------------------------------------------------------------
    # Intentionally absent. A publicly trusted certificate cannot be issued for
    # an IP address, so the interim phase is HTTP-only (recorded as an accepted
    # risk in docs/SERVER-OPS-LOG.md section 4.1). Once DNS resolves, run
    # `certbot --nginx -d fleet.unimaccompany.com`; it rewrites this block and
    # adds the 80 -> 443 redirect itself.
    #
    # Do NOT add HSTS before TLS is live. A browser that sees the header over
    # HTTP will refuse to load the site until HTTPS works, locking you out.

    # The SPA. Built assets only — no Node and no source on this box.
    root /var/www/unifleet/frontend;
    index index.html;

    charset utf-8;
    client_max_body_size 20M;

    # Logs per-site so an issue here is not buried in the global access log.
    access_log /var/log/nginx/unifleet.access.log;
    error_log  /var/log/nginx/unifleet.error.log;

    # ^~ so these win over the regex locations below and are never served as
    # static files by mistake.
    location ^~ /api {
        root /var/www/unifleet/backend/public;
        try_files $uri /index.php?$query_string;
    }

    # Laravel's own /up health route (bootstrap/app.php). Distinct from
    # /api/health, which is the richer check the uptime monitor should watch.
    location ^~ /up {
        root /var/www/unifleet/backend/public;
        try_files $uri /index.php?$query_string;
    }

    # php artisan storage:link target, for any user-facing file downloads.
    location ^~ /storage {
        root /var/www/unifleet/backend/public;
        try_files $uri =404;
    }

    location = /index.php {
        root /var/www/unifleet/backend/public;
        include        fastcgi_params;
        fastcgi_pass   unix:/run/php/php8.3-fpm.sock;
        fastcgi_param  SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param  DOCUMENT_ROOT   $document_root;
        fastcgi_hide_header X-Powered-By;

        # Reports and the AI insights page build synchronously and can exceed
        # the 60s default on a large date range.
        fastcgi_read_timeout 180;
    }

    # Nothing else in this tree is executable. Without this, an uploaded or
    # stray .php file anywhere under root could be run.
    location ~ \.php$ {
        return 404;
    }

    # SPA history fallback: deep links like /dashboard/system are client-side
    # routes with no file on disk, so they must return index.html rather than
    # nginx's 404. Listed last so it cannot shadow /api.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite writes content-hashed filenames, so these can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html must NOT be cached, or browsers keep loading an old bundle
    # that references deleted hashed assets after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location ~ /\. {
        deny all;
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
