# UNIFLEET — nginx site config, TLS version
#
# PREPARED, NOT INSTALLED. This replaces deploy/nginx/unifleet.conf once the
# AlphaSSL wildcard certificate files are on the box. Until then the HTTP-only
# file stays in place. See docs/SSL-INSTALL.md for the install procedure and
# docs/SERVER-OPS-LOG.md for the change record.
#
# Same same-origin design as the HTTP file: the SPA and the Laravel API are
# served from one host, src/lib/api.ts calls the relative path /api, so there is
# no CORS preflight and config/cors.php stays irrelevant in prod.
#
# Expects, created by docs/SSL-INSTALL.md:
#   /etc/ssl/unifleet/fullchain.pem   leaf certificate + AlphaSSL intermediate
#   /etc/ssl/unifleet/privkey.pem     private key, chmod 600, root-owned
#
# Install:
#   sudo cp deploy/nginx/unifleet-tls.conf /etc/nginx/sites-available/unifleet
#   sudo nginx -t && sudo systemctl reload nginx

# ── Port 80: redirect everything to HTTPS ────────────────────────────────────
# The bare IP stays listed. A request to http://8.213.39.81 cannot be redirected
# to https://8.213.39.81 (the certificate covers the hostname, not the IP), so
# it is sent to the hostname instead. Anything still bookmarked on the IP
# therefore keeps working rather than hitting a certificate warning.
server {
    listen 80;
    listen [::]:80;
    server_name 8.213.39.81 fleet.unimaccompany.com;

    return 301 https://fleet.unimaccompany.com$request_uri;
}

# ── Port 443: the application ────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name fleet.unimaccompany.com;

    # --- TLS -----------------------------------------------------------------
    # fullchain.pem must be leaf FIRST, then the AlphaSSL intermediate. In the
    # other order nginx starts without complaint and then fails to validate on
    # Android and in older Java clients, which is a confusing thing to debug.
    ssl_certificate     /etc/ssl/unifleet/fullchain.pem;
    ssl_certificate_key /etc/ssl/unifleet/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling. ssl_trusted_certificate is the INTERMEDIATE ALONE, not the
    # fullchain — nginx needs the issuer to verify the response it staples.
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/ssl/unifleet/intermediate.pem;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # HSTS — deliberately commented out. Turn it on only after HTTPS has been
    # confirmed working for a few days. A browser that has seen this header will
    # refuse to reach the site over HTTP at all, so if the certificate later
    # breaks there is no fallback and no way to tell users to ignore it. The
    # wildcard also means includeSubDomains would commit every other
    # unimaccompany.com host to HTTPS, which is not ours to decide.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # The SPA. Built assets only — no Node and no source on this box.
    root /var/www/unifleet/frontend;
    index index.html;

    charset utf-8;
    client_max_body_size 20M;

    # Logs per-site so an issue here is not buried in the global access log.
    access_log /var/log/nginx/unifleet.access.log;
    error_log  /var/log/nginx/unifleet.error.log;

    # ^~ so these win over the regex locations below and are never served as
    # static files by mistake.
    location ^~ /api {
        root /var/www/unifleet/backend/public;
        try_files $uri /index.php?$query_string;
    }

    # Laravel's own /up health route (bootstrap/app.php). Distinct from
    # /api/health, which is the richer check the uptime monitor should watch.
    location ^~ /up {
        root /var/www/unifleet/backend/public;
        try_files $uri /index.php?$query_string;
    }

    # php artisan storage:link target, for any user-facing file downloads.
    location ^~ /storage {
        root /var/www/unifleet/backend/public;
        try_files $uri =404;
    }

    location = /index.php {
        root /var/www/unifleet/backend/public;
        include        fastcgi_params;
        fastcgi_pass   unix:/run/php/php8.3-fpm.sock;
        fastcgi_param  SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param  DOCUMENT_ROOT   $document_root;
        fastcgi_hide_header X-Powered-By;

        # Reports and the AI insights page build synchronously and can exceed
        # the 60s default on a large date range.
        fastcgi_read_timeout 180;
    }

    # Nothing else in this tree is executable. Without this, an uploaded or
    # stray .php file anywhere under root could be run.
    location ~ \.php$ {
        return 404;
    }

    # SPA history fallback: deep links like /dashboard/system are client-side
    # routes with no file on disk, so they must return index.html rather than
    # nginx's 404. Listed last so it cannot shadow /api.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite writes content-hashed filenames, so these can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html must NOT be cached, or browsers keep loading an old bundle
    # that references deleted hashed assets after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location ~ /\. {
        deny all;
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
