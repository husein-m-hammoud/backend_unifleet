; UNIFLEET — PHP-FPM pool.
;
; Install:
;   sudo cp deploy/php/unifleet-pool.conf /etc/php/8.3/fpm/pool.d/unifleet.conf
;   sudo rm -f /etc/php/8.3/fpm/pool.d/www.conf     ; the default pool, unused
;   sudo systemctl restart php8.3-fpm
;
; The point of this file is the user/group. The default pool runs as www-data
; while deploys run as the service account, so Laravel writes
; storage/logs/laravel.log and bootstrap/cache as one user and reads them as
; another. That surfaces as intermittent 500s with nothing useful logged -
; because writing the log is itself what failed. Both must be the same account.

[unifleet]

user  = unifleet
group = unifleet

listen       = /run/php/php8.3-fpm.sock
listen.owner = www-data   ; nginx must be able to open the socket
listen.group = www-data
listen.mode  = 0660

pm                   = dynamic
pm.max_children      = 20   ; ~8 GiB box; each worker peaks near 128-256 MB
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; Recycle workers to bound any slow leak in a long-lived process.
pm.max_requests = 500

; Surface PHP's own fatals in the FPM log. Laravel catches most things, but an
; OOM or a startup failure never reaches Laravel's handler.
catch_workers_output = yes
php_admin_value[error_log] = /var/log/php8.3-fpm.unifleet.log
php_admin_flag[log_errors] = on

; The poller is the memory-hungry path: a full safee:poll crashed at 128M before
; writing any trips. That runs from cron via the CLI php.ini, not this pool, but
; the reports and AI insights endpoints build in-memory here and want headroom.
php_admin_value[memory_limit] = 512M

; Never render stack traces to the browser, whatever .env says.
php_admin_flag[display_errors] = off
php_admin_value[max_execution_time] = 180
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 20M
